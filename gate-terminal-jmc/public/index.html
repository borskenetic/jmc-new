<!DOCTYPE html>
<html lang="en">
<head>
  <title>Library Attendance — Offline Gate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/branding.css">
  <link rel="stylesheet" href="/css/scan.css">
  <link rel="stylesheet" href="/css/gate-overrides.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="syncBadge" class="gate-sync-badge gate-sync-badge--loading" aria-live="polite">Checking connection…</div>

<header>
  <div class="header">
    <div class="logo-title">
      <img src="/images/pantasLogo.png" alt="Logo" onerror="this.src='/images/d.png'; this.onerror=null;">
      <div class="system-title">POWERED BY PANTAS</div>
    </div>
  </div>
</header>

<div class="main">
  <div class="sidebar" id="scanSidebar">
    <div class="date" id="currentDate">Date</div>
    <div class="time" id="currentTime">--:--:--</div>

    <div class="profile-pic">
      <img src="/images/2x2_undifined_gender.jpg" alt="Default Profile" id="profileImg">
    </div>

    <div id="earlyOutAlarm" class="early-out-alarm" hidden aria-live="assertive" role="alert">
      <div class="early-out-alarm__icon">⚠</div>
      <div class="early-out-alarm__title">Early checkout not allowed</div>
      <p class="early-out-alarm__message" id="earlyOutAlarmMessage"></p>
      <p class="early-out-alarm__hint">Allowed after <strong id="earlyOutAlarmTime">4:00 PM</strong></p>
    </div>
  </div>

  <div class="right-content">
    <form id="scanForm">
      <textarea name="qrcode" id="qrcode" style="opacity:0; position:absolute;" autofocus autocomplete="off"></textarea>
    </form>
    <video muted autoplay loop playsinline class="ads-vid" id="gateVideo">
      <source src="/videos/area51_product_slideshow.mp4" type="video/mp4">
    </video>
  </div>
</div>

<footer>
  <div class="footer1">
    <div class="footer-logo">
      <div class="marquee-container">
        <div class="marquee">
          <span id="footerAppName">Welcome to Jose Maria College</span>
        </div>
      </div>
    </div>
  </div>
</footer>

<div id="sectionModal" class="section-modal" aria-hidden="true" style="display:none;">
  <div class="modal-content section-picker-modal">
    <h2>Select section</h2>
    <div class="section-buttons" id="sectionButtons"></div>
  </div>
</div>

<audio id="scanAlarmSound" src="/sounds/alarm.wav" preload="auto"></audio>

<div id="testPanel" class="gate-test-panel" hidden>
  <div class="gate-test-panel__inner">
    <strong>Test mode</strong> (no scanner) — F2 to hide
    <div class="gate-test-panel__row">
      <select id="testStudentSelect" class="gate-test-select">
        <option value="">Pick a student…</option>
      </select>
      <input type="text" id="testManualInput" class="gate-test-input" placeholder="Or type QR / school ID / RFID">
      <button type="button" id="testScanBtn" class="gate-test-btn">Simulate scan</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
